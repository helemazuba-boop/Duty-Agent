name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release version
        id: ver
        shell: bash
        run: |
          # Tag pushes drive stamped releases (v1.2.3 -> 1.2.3); manual runs on
          # a branch keep the csproj/manifest defaults instead of shipping a
          # branch name as a version.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} must look like v1.2.3[.4]"
              exit 1
            fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: duty-agent-ui
        run: npm ci

      - name: Build release (client + bridge + backend, self-contained, zipped)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $args = @()
          if ($env:RELEASE_VERSION) { $args += @('-ReleaseVersion', $env:RELEASE_VERSION) }
          ./build_client.bat @args

      - name: Collect release artifacts
        id: collect
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path .release -Filter *.zip -File |
            Sort-Object LastWriteTime -Descending
          if ($zips.Count -eq 0) { throw "No release zip produced under .release" }
          # Explicit roles instead of "two newest": the backend bundle always
          # carries the -backend suffix; the main package is the newest zip
          # that is NOT the backend bundle.
          $backendZip = $zips | Where-Object { $_.Name -like '*-backend.zip' } | Select-Object -First 1
          $mainZip = $zips | Where-Object { $_.Name -notlike '*-backend.zip' } | Select-Object -First 1
          if (-not $mainZip) { throw "No main release zip produced under .release" }
          $staging = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($zip in @($mainZip, $backendZip) | Where-Object { $_ }) {
            Copy-Item $zip.FullName -Destination $staging -Force
          }
          echo "assets_dir=$staging" >> "$env:GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duty-agent-release
          path: ${{ steps.collect.outputs.assets_dir }}/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.assets_dir }}/*.zip
          generate_release_notes: true

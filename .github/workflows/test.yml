name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        # 3.11 on purpose: Assets_Duty\python-embed ships CPython 3.11.9, so CI
        # must exercise the same minor version as the release runtime.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests (one process per unittest file)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location Assets_Duty
          try {
            # Every Assets_Duty\test_*.py is a standalone unittest.main()
            # script (the suite never adopted pytest), so they are executed
            # directly, one interpreter per file, and the job fails if any of
            # them exits non-zero. test_stderr.txt / test_output.txt are not
            # .py files and never match the filter.
            #
            # Skip list is intentionally EMPTY. It used to hold
            # test_auto_run_runtime.py ("stale pre-D5 expectations"), but those
            # expectations were reconciled with the D5 claim-first semantics
            # (claim_auto_run_today stamps the date at claim time) and the file
            # passes 15/15 under python-embed 3.11 with the same dependency set
            # CI installs. Keeping it skipped left the whole auto-run chain -
            # the only unattended entry point into scheduling - with zero
            # regression protection.
            $skipped = @{}
            $passed = @()
            $skippedList = @()
            $failed = @()
            $tests = Get-ChildItem -Filter "test_*.py" -File | Sort-Object Name
            if ($tests.Count -eq 0) { throw "No Assets_Duty/test_*.py found." }
            foreach ($test in $tests) {
              Write-Host ""
              Write-Host "=== $($test.Name) ==="
              if ($skipped.ContainsKey($test.Name)) {
                Write-Host "::warning::SKIPPED $($test.Name): $($skipped[$test.Name])"
                $skippedList += $test.Name
                continue
              }
              & python $test.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::FAILED $($test.Name) (exit code $LASTEXITCODE)"
                $failed += $test.Name
              }
              else {
                Write-Host "PASSED $($test.Name)"
                $passed += $test.Name
              }
            }
            Write-Host ""
            Write-Host "=== Summary: $($passed.Count) passed, $($skippedList.Count) skipped, $($failed.Count) failed ==="
            if ($failed.Count -gt 0) {
              throw "Failing tests: $($failed -join ', ')"
            }
          }
          finally {
            Pop-Location
          }

      - name: Setup .NET 8
        # windows-latest ships the .NET 8 SDK, pinned here to match
        # release.yml so both workflows resolve the same SDK.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build standalone client (DutyAgent.Client)
        run: dotnet build DutyAgent.Client/DutyAgent.Client.csproj -c Release --nologo

      - name: Build ClassIsland bridge (DutyAgentBridge)
        run: dotnet build Duty-Agent-ClassIsland-Bridge/DutyAgentBridge.csproj -c Release --nologo

      # 以前这里只 build 不 test：ScopeNameTests（包身份 ScopeName 前缀顺序 bug 的
      # 回归，2026-10-13 那个"打不开就崩"的真 bug 就是它当场抓到的）、
      # AutoStartCommandTests / AutoStartRunValueTests 和 BridgeMetaResolverTests
      # 全都没进 CI。没有测试的回归等于没有回归。
      - name: Run client unit tests (DutyAgent.Client.Tests)
        # 覆盖 ScopeName（商店版崩溃回归）、AUMID 自启命令与 Run 值名作用域、
        # 触摸模态循环命令映射。GUI 测试不存在，全部是纯函数级用例。
        run: dotnet test DutyAgent.Client.Tests/DutyAgent.Client.Tests.csproj -c Release --nologo

      - name: Run bridge unit tests (DutyAgentBridge.Tests)
        run: dotnet test Duty-Agent-ClassIsland-Bridge.Tests/DutyAgentBridge.Tests.csproj -c Release --nologo
